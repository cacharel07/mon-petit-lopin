# Builds the app on GitHub and publishes a ready-to-run copy on the `deploy`
# branch (build output + production node_modules), so the server never has to
# run `npm ci` or `vite build` (not possible with the host's SSH memory limit).
name: Build deploy branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-branch
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same major version as the server (alwaysdata).
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Check and test
        run: |
          npm run check
          npm test

      - name: Build
        # The build analyses the app, which validates the env vars.
        env:
          ADMIN_PASSWORD_HASH: scrypt:00:00
        run: npm run build

      - name: Assemble the deploy tree
        run: |
          mkdir dist
          cp -r build drizzle scripts src package.json package-lock.json .npmrc .env.example README.md dist/
          cp deploy/gitignore dist/.gitignore
          cd dist
          npm ci --omit=dev --no-audit --no-fund
          # Native modules must load on Linux x64 with this Node version.
          node -e "new (require('better-sqlite3'))(':memory:'); require('sharp'); console.log('native modules OK')"

      - name: Push to the deploy branch
        working-directory: dist
        run: |
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy build of ${GITHUB_SHA::7}"
          # Single commit, force-pushed: the branch never accumulates history.
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:deploy
